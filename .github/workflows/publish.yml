name: publish

on:
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Write Secrets Info
        run: |
          echo mavenCentralUsername='${{ secrets.OSSRH_USERNAME }}' >> gradle.properties
          echo mavenCentralPassword='${{ secrets.OSSRH_PASSWORD }}' >> gradle.properties
          echo signing.keyId='${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}' >> gradle.properties
          echo signing.password='${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}' >> gradle.properties
          echo signing.secretKeyRingFile='${{ github.workspace }}/secring.gpg' >> gradle.properties
          echo ${{ secrets.OSSRH_GPG_SECRET_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/secring.gpg

      - run: chmod 777 ./gradlew

      - run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Build sample APK
        run: ./gradlew :priv-sample:assembleRelease --no-configuration-cache

      - uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body_path: ./CHANGELOG.md

      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./priv-sample/build/outputs/apk/legacy/release/priv-sample-legacy-release.apk
          asset_name: priv-sample-legacy-${{ github.ref_name }}.apk
          asset_content_type: application/vnd.android.package-archive

      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./priv-sample/build/outputs/apk/api29/release/priv-sample-api29-release.apk
          asset_name: priv-sample-api29-${{ github.ref_name }}.apk
          asset_content_type: application/vnd.android.package-archive

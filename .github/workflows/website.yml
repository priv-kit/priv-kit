name: website

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'priv-website/**'
      - 'priv-ui/**'
      - 'priv-playground/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/website.yml'

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: pnpm/setup@v2

      - run: pnpm build

      - name: Deploy website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx --allow-build=sharp --allow-build=workerd wrangler@4
          pages deploy priv-website/.vitepress/dist --project-name=priv-kit
